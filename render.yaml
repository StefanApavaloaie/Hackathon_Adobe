services:
  - type: web
    name: winback-agent-api
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_MODE
        value: saved
      # Never add ALLOW_DEV_AUTH here or in the dashboard: it turns the login check off.
      # Set these in the Render dashboard. They are never stored in the repo.
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Not used: login is checked by asking Supabase directly. Leave it blank.
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RECIPIENT_ALLOWLIST
        sync: false
